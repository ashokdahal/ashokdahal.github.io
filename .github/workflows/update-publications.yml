name: Update publications from Google Scholar

on:
  schedule:
    # 06:00 UTC every Monday. GitHub may delay scheduled runs by a few
    # minutes to hours at busy times; that's fine for a weekly sync.
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest data from Google Scholar
        id: fetch
        run: node scripts/fetch-scholar.js
        continue-on-error: true

      - name: Commit updated data
        if: steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/publications.json data/metrics.json; then
            echo "No changes to publication data."
          else
            git add data/publications.json data/metrics.json
            git commit -m "chore: sync publications from Google Scholar"
            git push
          fi

      - name: Report failed fetch
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::warning::Google Scholar fetch failed (likely rate-limited or its markup changed). Existing data was left untouched; this will retry on the next scheduled run."
